<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetWatch — мониторинг SNMP</title>
<style>
:root{
  --bg:#f4f6f9;--panel:#fff;--panel2:#f8fafc;--text:#1b2430;--muted:#6b7686;--border:#e2e7ee;
  --accent:#2563eb;--accent-weak:#e8efff;--ok:#16a34a;--warn:#d97706;--crit:#dc2626;--grey:#94a3b8;
  --in:#2563eb;--out:#10b981;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
:root[data-theme="dark"]{
  --bg:#0f141b;--panel:#171e28;--panel2:#1d2531;--text:#e6ebf2;--muted:#8d99aa;--border:#2a3442;
  --accent:#5b8cff;--accent-weak:#1f2b45;--ok:#22c55e;--warn:#f59e0b;--crit:#f05252;--grey:#64748b;
  --in:#5b8cff;--out:#34d399;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none;cursor:pointer}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 10px;width:100%}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}

/* layout */
#app{display:flex;min-height:100vh}
.side{width:220px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
.brand{padding:16px;font-weight:700;font-size:17px;display:flex;gap:8px;align-items:center}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.nav a{display:flex;justify-content:space-between;padding:9px 16px;color:var(--text);border-left:3px solid transparent}
.nav a:hover{background:var(--panel2)}
.nav a.active{background:var(--accent-weak);border-left-color:var(--accent);color:var(--accent);font-weight:600}
.side .foot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--panel)}
.top h1{font-size:18px;margin:0;flex:1}
.content{padding:20px 24px;max-width:1400px;width:100%}
.menu-btn{display:none}

/* components */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.stat .v{font-size:28px;font-weight:700} .stat .l{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none}
tr.click:hover td{background:var(--panel2);cursor:pointer}
.tbl-wrap{overflow-x:auto}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.s-up{background:var(--ok)} .s-degraded{background:var(--warn)} .s-down{background:var(--crit)} .s-maint,.s-unknown{background:var(--grey)}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid currentColor}
.b-critical{color:var(--crit)} .b-warning{color:var(--warn)} .b-info{color:var(--accent)}
.b-active{color:var(--crit)} .b-acknowledged{color:var(--warn)} .b-resolved{color:var(--ok)}
.muted{color:var(--muted)} .mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar input,.toolbar select{width:auto}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:8px 14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:4px 10px;cursor:pointer;font-size:12px}
.seg button.on{background:var(--accent);color:#fff}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent)}
.kv{display:grid;grid-template-columns:160px 1fr;gap:6px 12px}
.kv div:nth-child(odd){color:var(--muted)}
.chart{position:relative;width:100%;height:220px}
.chart svg{width:100%;height:100%;display:block}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.15);white-space:nowrap;display:none;z-index:5}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:3px;margin-right:5px;vertical-align:middle}
.event{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.event:last-child{border:0}
.event time{color:var(--muted);font-size:12px;flex:none;width:64px}

/* modal / toast */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:12px;padding:20px;width:520px;max-width:100%;max-height:90vh;overflow:auto}
.modal h2{margin:0 0 8px;font-size:17px}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;box-shadow:0 6px 18px rgba(0,0,0,.15);max-width:340px;font-size:13px}
.toast.critical{border-left-color:var(--crit)} .toast.ok{border-left-color:var(--ok)} .toast.warning{border-left-color:var(--warn)}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;width:100%}
.login .card{width:360px;padding:28px}
.err{color:var(--crit);font-size:13px;margin-top:8px}

@media (max-width:1100px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:760px){
  .side{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);transition:.2s}
  .side.open{transform:none}
  .menu-btn{display:inline-block}
  .g4,.g3,.g2,.row2{grid-template-columns:1fr}
  .content{padding:16px}.top{padding:10px 16px}
  .kv{grid-template-columns:120px 1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<script src="js/sim.js"></script>
<script src="js/engine.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
<script src="js/device.js"></script>
<script src="js/views.js"></script>
</body>
</html>
